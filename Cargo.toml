[package]
name = "rootstock"
version = "0.1.0"
edition = "2024"
description = "Version control server for agent swarms, with git underneath as the source of truth"
license = "Apache-2.0"
repository = "https://github.com/appnice/rootstock"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
diffy = "0.4"
flate2 = "1"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
im = "15"
libc = "0.2"
notify = "8"
rand = "0.8"
regex = "1"
regex-syntax = "0.8.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.8"
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
streaming-iterator = "0.1.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
